<svg width="1280" height="640" viewBox="0 0 1280 640"
     xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0b1220"/>
      <stop offset="55%"  stop-color="#111d35"/>
      <stop offset="100%" stop-color="#182d52"/>
    </linearGradient>

    <!-- Title text gradient -->
    <linearGradient id="titleGrad" x1="540" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#60aaff"/>
      <stop offset="100%" stop-color="#a8d8ff"/>
    </linearGradient>

    <!-- Screen sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#050d1c"/>
      <stop offset="100%" stop-color="#162e5a"/>
    </linearGradient>

    <!-- Screen vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Ambient glow behind device -->
    <radialGradient id="deviceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3070d0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3070d0" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip to screen circle -->
    <clipPath id="screenClip">
      <circle cx="268" cy="322" r="206"/>
    </clipPath>

    <!-- Soft drop shadow / glow on ring -->
    <filter id="ringGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle text shadow -->
    <filter id="textShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>

  </defs>

  <!-- ── Background ──────────────────────────────────────────────── -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle diagonal stripe texture -->
  <line x1="0"    y1="160"  x2="160"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="0"    y1="320"  x2="320"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="0"    y1="480"  x2="480"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="0"    y1="640"  x2="640"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="160"  y1="640"  x2="800"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="320"  y1="640"  x2="960"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="480"  y1="640"  x2="1120" y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="640"  y1="640"  x2="1280" y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="800"  y1="640"  x2="1280" y2="160"  stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="960"  y1="640"  x2="1280" y2="320"  stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="1120" y1="640"  x2="1280" y2="480"  stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>

  <!-- ── Device ambient glow ─────────────────────────────────────── -->
  <ellipse cx="268" cy="322" rx="310" ry="310" fill="url(#deviceGlow)"/>

  <!-- ── Presto device — outer decorative rings ─────────────────── -->
  <circle cx="268" cy="322" r="252" fill="none" stroke="#1a3060" stroke-width="1.5" opacity="0.35"/>
  <circle cx="268" cy="322" r="238" fill="none" stroke="#1e3870" stroke-width="1"   opacity="0.25"/>

  <!-- Device bezel -->
  <circle cx="268" cy="322" r="226" fill="#0a1526"/>
  <circle cx="268" cy="322" r="222" fill="#0c1b30"/>

  <!-- ── Screen content (clipped to circle) ─────────────────────── -->
  <g clip-path="url(#screenClip)">

    <!-- Sky background -->
    <rect x="62" y="116" width="412" height="412" fill="url(#skyGrad)"/>

    <!-- Stars -->
    <circle cx="110" cy="155" r="1.8" fill="#fff" opacity="0.75"/>
    <circle cx="152" cy="138" r="1.2" fill="#fff" opacity="0.55"/>
    <circle cx="195" cy="163" r="2.2" fill="#fff" opacity="0.80"/>
    <circle cx="238" cy="143" r="1.5" fill="#fff" opacity="0.60"/>
    <circle cx="285" cy="130" r="1.8" fill="#fff" opacity="0.70"/>
    <circle cx="340" cy="152" r="1.2" fill="#fff" opacity="0.50"/>
    <circle cx="388" cy="140" r="2.0" fill="#fff" opacity="0.75"/>
    <circle cx="426" cy="165" r="1.5" fill="#fff" opacity="0.60"/>
    <circle cx="135" cy="195" r="1.0" fill="#fff" opacity="0.40"/>
    <circle cx="310" cy="175" r="1.5" fill="#fff" opacity="0.65"/>
    <circle cx="455" cy="145" r="1.2" fill="#fff" opacity="0.45"/>
    <circle cx="92"  cy="210" r="1.5" fill="#fff" opacity="0.55"/>
    <circle cx="360" cy="115" r="1.0" fill="#fff" opacity="0.50"/>

    <!-- Moon glow halo -->
    <circle cx="382" cy="196" r="42" fill="#204080" opacity="0.40"/>
    <!-- Moon -->
    <circle cx="382" cy="196" r="30" fill="#c8daf0"/>
    <!-- Moon shading (crescent effect) -->
    <circle cx="370" cy="190" r="24" fill="#a0b8d0" opacity="0.45"/>

    <!-- Distant mountain range -->
    <polygon
      points="62,348  108,268  152,318  200,238  256,298  310,222  368,285  418,240  474,290  474,348"
      fill="#0a1c38"/>

    <!-- Foreground mountain range -->
    <polygon
      points="62,348  130,275  186,334  248,258  318,318  388,262  448,310  474,290  474,348"
      fill="#060e20"/>

    <!-- Lake / ground -->
    <rect x="62" y="348" width="412" height="180" fill="#060c1c"/>

    <!-- Water reflection of moon -->
    <ellipse cx="268" cy="390" rx="18" ry="55" fill="#1a3870" opacity="0.55"/>
    <ellipse cx="268" cy="390" rx="8"  ry="55" fill="#2050a0" opacity="0.30"/>

    <!-- Water ripple lines -->
    <ellipse cx="268" cy="400" rx="80" ry="5" fill="none" stroke="#1e4080" stroke-width="1.2" opacity="0.35"/>
    <ellipse cx="268" cy="416" rx="60" ry="4" fill="none" stroke="#1e4080" stroke-width="1.0" opacity="0.25"/>
    <ellipse cx="268" cy="430" rx="42" ry="3" fill="none" stroke="#1e4080" stroke-width="0.8" opacity="0.18"/>

    <!-- Bottom info bar -->
    <rect x="62" y="440" width="412" height="40" fill="#04080f" opacity="0.88"/>
    <text x="268" y="466"
          font-family="'Courier New', Courier, monospace"
          font-size="14" font-weight="600"
          fill="#4888e0" text-anchor="middle" letter-spacing="2.5">PRESTO PHOTOS</text>

    <!-- Screen vignette overlay -->
    <circle cx="268" cy="322" r="206" fill="url(#vignette)"/>

  </g>

  <!-- ── Device ring frame (drawn over clipped content) ─────────── -->
  <circle cx="268" cy="322" r="206" fill="none"
          stroke="#2a5090" stroke-width="5"
          filter="url(#ringGlow)"/>
  <circle cx="268" cy="322" r="209" fill="none" stroke="#162848" stroke-width="2" opacity="0.6"/>
  <circle cx="268" cy="322" r="203" fill="none" stroke="#0e1e38" stroke-width="2" opacity="0.4"/>

  <!-- ── Right-side text content ─────────────────────────────────── -->

  <!-- Project name -->
  <text x="544" y="186"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="90" font-weight="800"
        fill="url(#titleGrad)"
        filter="url(#textShadow)"
        letter-spacing="-2">Presto Photos</text>

  <!-- Subtitle / tagline -->
  <text x="546" y="240"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="400"
        fill="#5a88b8">Immich photo slideshow for Pimoroni Presto</text>

  <!-- Horizontal rule -->
  <rect x="544" y="264" width="694" height="1.5" fill="#1e3860" rx="1"/>

  <!-- Feature list -->
  <!-- Feature 1 -->
  <rect x="546" y="287" width="8" height="8" rx="2" fill="#4888e0"/>
  <text x="568" y="298"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25" fill="#80aad0">
    Streams photos directly from your Immich library
  </text>

  <!-- Feature 2 -->
  <rect x="546" y="327" width="8" height="8" rx="2" fill="#4888e0"/>
  <text x="568" y="338"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25" fill="#80aad0">
    Full 480&#215;480 display with SD card JPEG streaming
  </text>

  <!-- Feature 3 -->
  <rect x="546" y="367" width="8" height="8" rx="2" fill="#4888e0"/>
  <text x="568" y="378"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25" fill="#80aad0">
    Browser-based WiFi and Immich server setup
  </text>

  <!-- Feature 4 -->
  <rect x="546" y="407" width="8" height="8" rx="2" fill="#4888e0"/>
  <text x="568" y="418"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25" fill="#80aad0">
    Touch controls &#183; auto-advance &#183; ambient light sensor
  </text>

  <!-- Horizontal rule -->
  <rect x="544" y="444" width="694" height="1" fill="#182e50" rx="1"/>

  <!-- Tech badge row -->
  <!-- MicroPython -->
  <rect x="544" y="462" width="178" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="633" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">MicroPython</text>

  <!-- RP2350 -->
  <rect x="734" y="462" width="118" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="793" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">RP2350</text>

  <!-- Immich -->
  <rect x="864" y="462" width="102" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="915" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">Immich</text>

  <!-- LittleFS -->
  <rect x="978" y="462" width="120" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="1038" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">LittleFS</text>

  <!-- WiFi -->
  <rect x="1110" y="462" width="80" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="1150" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">WiFi</text>

  <!-- Repo URL / footer -->
  <text x="544" y="568"
        font-family="'Courier New', Courier, monospace"
        font-size="18" fill="#2e5080">github.com/vwillcox/presto-immich</text>

  <!-- Version tag -->
  <rect x="544" y="582" width="0" height="0"/>

</svg>
