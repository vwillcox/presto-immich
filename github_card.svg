<svg width="1280" height="640" viewBox="0 0 1280 640"
     xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0b1220"/>
      <stop offset="55%"  stop-color="#111d35"/>
      <stop offset="100%" stop-color="#182d52"/>
    </linearGradient>

    <!-- Title text gradient -->
    <linearGradient id="titleGrad" x1="540" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#60aaff"/>
      <stop offset="100%" stop-color="#a8d8ff"/>
    </linearGradient>

    <!-- Screen sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#050d1c"/>
      <stop offset="100%" stop-color="#162e5a"/>
    </linearGradient>

    <!-- Screen vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Ambient glow behind device -->
    <radialGradient id="deviceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3070d0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3070d0" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip content to screen rectangle -->
    <clipPath id="screenClip">
      <rect x="64" y="130" width="384" height="384" rx="10"/>
    </clipPath>

    <!-- Glow on device frame -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle text shadow -->
    <filter id="textShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>

  </defs>

  <!-- ── Background ──────────────────────────────────────────────── -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle diagonal stripe texture -->
  <line x1="0"    y1="160"  x2="160"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="0"    y1="320"  x2="320"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="0"    y1="480"  x2="480"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="0"    y1="640"  x2="640"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="160"  y1="640"  x2="800"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="320"  y1="640"  x2="960"  y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="480"  y1="640"  x2="1120" y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="640"  y1="640"  x2="1280" y2="0"    stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="800"  y1="640"  x2="1280" y2="160"  stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="960"  y1="640"  x2="1280" y2="320"  stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="1120" y1="640"  x2="1280" y2="480"  stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>

  <!-- ── Device ambient glow ─────────────────────────────────────── -->
  <ellipse cx="256" cy="322" rx="300" ry="290" fill="url(#deviceGlow)"/>

  <!-- ── Presto device — outer decorative rings (square) ────────── -->
  <rect x="34"  y="108" width="444" height="444" rx="32"
        fill="none" stroke="#1a3060" stroke-width="1.5" opacity="0.35"/>
  <rect x="44"  y="118" width="424" height="424" rx="28"
        fill="none" stroke="#1e3870" stroke-width="1"   opacity="0.25"/>

  <!-- Device outer case / bezel -->
  <rect x="50"  y="124" width="412" height="412" rx="24" fill="#0a1526"/>
  <rect x="56"  y="130" width="400" height="400" rx="21" fill="#0c1b30"/>

  <!-- ── Screen content (clipped to square screen) ──────────────── -->
  <g clip-path="url(#screenClip)">

    <!-- Sky background -->
    <rect x="64" y="130" width="384" height="384" fill="url(#skyGrad)"/>

    <!-- Stars -->
    <circle cx="108" cy="165" r="1.8" fill="#fff" opacity="0.75"/>
    <circle cx="148" cy="148" r="1.2" fill="#fff" opacity="0.55"/>
    <circle cx="192" cy="172" r="2.0" fill="#fff" opacity="0.78"/>
    <circle cx="236" cy="152" r="1.5" fill="#fff" opacity="0.60"/>
    <circle cx="280" cy="140" r="1.8" fill="#fff" opacity="0.70"/>
    <circle cx="330" cy="162" r="1.2" fill="#fff" opacity="0.50"/>
    <circle cx="374" cy="150" r="2.0" fill="#fff" opacity="0.72"/>
    <circle cx="416" cy="170" r="1.5" fill="#fff" opacity="0.58"/>
    <circle cx="130" cy="198" r="1.0" fill="#fff" opacity="0.40"/>
    <circle cx="305" cy="180" r="1.5" fill="#fff" opacity="0.65"/>
    <circle cx="440" cy="155" r="1.2" fill="#fff" opacity="0.45"/>
    <circle cx="88"  cy="215" r="1.5" fill="#fff" opacity="0.52"/>
    <circle cx="355" cy="132" r="1.0" fill="#fff" opacity="0.48"/>
    <circle cx="175" cy="135" r="1.3" fill="#fff" opacity="0.55"/>

    <!-- Moon glow halo -->
    <circle cx="376" cy="202" r="40" fill="#204080" opacity="0.38"/>
    <!-- Moon -->
    <circle cx="376" cy="202" r="28" fill="#c8daf0"/>
    <!-- Moon shading -->
    <circle cx="364" cy="196" r="22" fill="#a0b8d0" opacity="0.42"/>

    <!-- Distant mountain range -->
    <polygon
      points="64,352  110,272  155,320  205,240  262,305  318,228  374,292  422,248  448,280  448,352"
      fill="#0a1c38"/>

    <!-- Foreground mountain range -->
    <polygon
      points="64,352  132,278  190,338  252,260  322,322  390,266  448,310  448,352"
      fill="#060e20"/>

    <!-- Lake / ground -->
    <rect x="64" y="352" width="384" height="162" fill="#060c1c"/>

    <!-- Water reflection of moon -->
    <ellipse cx="256" cy="396" rx="16" ry="52" fill="#1a3870" opacity="0.55"/>
    <ellipse cx="256" cy="396" rx="7"  ry="52" fill="#2050a0" opacity="0.28"/>

    <!-- Water ripple lines -->
    <ellipse cx="256" cy="408" rx="76" ry="5" fill="none" stroke="#1e4080" stroke-width="1.2" opacity="0.32"/>
    <ellipse cx="256" cy="424" rx="56" ry="4" fill="none" stroke="#1e4080" stroke-width="1.0" opacity="0.22"/>
    <ellipse cx="256" cy="438" rx="38" ry="3" fill="none" stroke="#1e4080" stroke-width="0.8" opacity="0.16"/>

    <!-- Bottom info bar -->
    <rect x="64" y="472" width="384" height="42" fill="#04080f" opacity="0.88"/>
    <text x="256" y="499"
          font-family="'Courier New', Courier, monospace"
          font-size="14" font-weight="600"
          fill="#4888e0" text-anchor="middle" letter-spacing="2.5">PRESTO PHOTOS</text>

    <!-- Screen vignette overlay -->
    <rect x="64" y="130" width="384" height="384" rx="10" fill="url(#vignette)"/>

  </g>

  <!-- ── Device screen frame (drawn over clipped content) ───────── -->
  <rect x="64" y="130" width="384" height="384" rx="10"
        fill="none" stroke="#2a5090" stroke-width="5"
        filter="url(#ringGlow)"/>
  <rect x="61" y="127" width="390" height="390" rx="12"
        fill="none" stroke="#162848" stroke-width="2" opacity="0.55"/>
  <rect x="67" y="133" width="378" height="378" rx="9"
        fill="none" stroke="#0e1e38" stroke-width="1.5" opacity="0.38"/>

  <!-- ── Right-side text content ─────────────────────────────────── -->

  <!-- Project name -->
  <text x="544" y="186"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="90" font-weight="800"
        fill="url(#titleGrad)"
        filter="url(#textShadow)"
        letter-spacing="-2">Presto Immich</text>

  <!-- Subtitle / tagline -->
  <text x="546" y="240"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="400"
        fill="#5a88b8">Immich photo slideshow for Pimoroni Presto</text>

  <!-- Horizontal rule -->
  <rect x="544" y="264" width="694" height="1.5" fill="#1e3860" rx="1"/>

  <!-- Feature 1 -->
  <rect x="546" y="287" width="8" height="8" rx="2" fill="#4888e0"/>
  <text x="568" y="298"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25" fill="#80aad0">
    Streams photos directly from your Immich library
  </text>

  <!-- Feature 2 -->
  <rect x="546" y="327" width="8" height="8" rx="2" fill="#4888e0"/>
  <text x="568" y="338"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25" fill="#80aad0">
    Full 480&#215;480 display with SD card JPEG streaming
  </text>

  <!-- Feature 3 -->
  <rect x="546" y="367" width="8" height="8" rx="2" fill="#4888e0"/>
  <text x="568" y="378"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25" fill="#80aad0">
    Browser-based WiFi and Immich server setup
  </text>

  <!-- Feature 4 -->
  <rect x="546" y="407" width="8" height="8" rx="2" fill="#4888e0"/>
  <text x="568" y="418"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25" fill="#80aad0">
    Touch controls &#183; auto-advance &#183; slideshow timer
  </text>

  <!-- Horizontal rule -->
  <rect x="544" y="444" width="694" height="1" fill="#182e50" rx="1"/>

  <!-- Tech badge row -->
  <rect x="544" y="462" width="178" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="633" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">MicroPython</text>

  <rect x="734" y="462" width="118" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="793" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">RP2350</text>

  <rect x="864" y="462" width="102" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="915" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">Immich</text>

  <rect x="978" y="462" width="120" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="1038" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">LittleFS</text>

  <rect x="1110" y="462" width="80" height="42" rx="7" fill="#0c1a30" stroke="#244070" stroke-width="1.5"/>
  <text x="1150" y="489"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="600"
        fill="#5090e0" text-anchor="middle">WiFi</text>

  <!-- Footer repo URL -->
  <text x="544" y="568"
        font-family="'Courier New', Courier, monospace"
        font-size="18" fill="#2e5080">github.com/vwillcox/presto-immich</text>

</svg>
